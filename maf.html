  function mt_rand(min = 0, max = Number.MAX_SAFE_INTEGER) {
    return Math.floor(Math.random() * (max - min + 1) ) + min;
  }

  function randf(min,max){
     return ((Math.random() * (max - min + 1) ) + min);
  }
  function random_int(min,max){
    return mt_rand(min,max);
  }

  function mt_getrandmax(){
    return Number.MAX_SAFE_INTEGER;

function d2r(deg){
    return (deg * (Math.PI / 180));
}

  function randfrom(myarray){
    return myarray[Math.floor(Math.random() * myarray.length)];
  }
  function clone(thing){
    return JSON.parse(JSON.stringify(thing));

var IMG_ARC_PIE = 69

var font = null;



 function imagecolorallocate(nimg,r,g,b,a=255){
    var color = {};
    color.r = r;
    color.g = g;
    color.b = b;
    color.a = a;
    color.style = "#"  + r.toString(16).padStart(2,"0") + g.toString(16).padStart(2,"0") + b.toString(16).padStart(2,"0") + a.toString(16).padStart(2,"0");
    return color;
   }

   function imagecolorallocatealpha(nimg,r,g,b,a){
    return imagecolorallocate(nimg,r,g,b,a);
   }


  function imagefilledellipse(image,cx,cy,iw,ih,cs){
    image.fillStyle = cs.style;
    image.beginPath();
    image.ellipse(cx,cy,iw/2,ih/2,0,0,Math.PI*2);
    image.fill();
    
  }

  function imageellipse(image,cx,cy,iw,ih,cs){
    image.strokeStyle = cs.style;
    image.beginPath();
    image.ellipse(cx,cy,iw/2,ih/2,0,0,Math.PI*2);
    image.stroke();
  }

  function imagearc(image,cx,cy,w,h,sa,ea,ci){
var cs = imagecolorallocatealpha(image,ci.r,ci.g,ci.b,125);
 image.strokeStyle = cs.style;
    image.beginPath();
    image.ellipse(cx,cy,w/2,h/2,0,d2r(sa),d2r(ea));
    image.stroke();
}

function imagefilledarc(image,cx,cy,w,h,sa,ea,c,idk){
image.fillStyle = c.style;
    image.beginPath();
    image.moveTo(cx,cy);
    image.ellipse(cx,cy,w/2,h/2,0,d2r(sa),d2r(ea));
    image.lineTo(cx,cy);
    
    image.fill();
}


  function array(a,b,c){

function imagegradientellipse(image, cx, cy, iw, ih, ic, oc){
    var w = Math.abs(iw);
    var h = Math.abs(ih);
    
    var bb = imagecolorallocate(image, 0,0,0);
    imagefilledellipse(image, cx, cy, w+4, h+4, bb);
    
   c0 = (oc.r - ic.r) / w;
       c1 = (oc.g - ic.g) / w;
       c2 = (oc.b - ic.b) / w;
       
   var i = 0;
   var j = 0;
   var is = (w<h)?(w/h):1;
   var js = (h<w)?(h/w):1;
    var   usestr = mt_rand(0,10);
    var   offsamt = mt_rand(-5,5);
    while(1){
        offsamt = offsamt + mt_rand(-3,3);
        if (usestr > 6) offsamt = 0;
        r = oc.r - Math.floor(i * c0) + offsamt;
        g = oc.g - Math.floor(i * c1)+ offsamt;;
        b = oc.b - Math.floor(i * c2)+ offsamt;;
        c = imagecolorallocate(image, clamp(r), clamp(g), clamp(b));
        imagefilledellipse(image, cx, cy, w-i, h-j, c);
        if(i < w){
            i += is;
        }
        if(j < h){
            j += js;
        }
        if(i >= w && j >= h){
            break;
        }
    }


}

function imagegradientellipsealpha(image, cx, cy, w, h, ic, oc){
       w = abs(w);
       h = abs(h);
    
       c0 = (oc.r - ic.r) / w;
       c1 = (oc.g - ic.g) / w;
       c2 = (oc.b - ic.b) / w;
       ot = oc.a
       it = ic.a;
       ct = (ot - it) / w;
       i = 0;
       j = 0;
       is = (w<h)?(w/h):1;
       js = (h<w)?(h/w):1;
       while(1){
           r = oc.r - floor(i * c0);
           g = oc.g - floor(i * c1);
           b = oc.b - floor(i * c2);
           t = ot - floor(i * ct);
           c = imagecolorallocatealpha(image, r, g, b, t);
           imageellipse(image, cx, cy, w-i, h-j, c);
           if(i < w){
               i += is;
           }
           if(j < h){
               j += js;
           }
           if(i >= w && j >= h){
               break;
           }
       }
    }


function flipovermid(col){
  var rx = col.r - 127;
  var gx = col.g - 127;
  var bx = col.b - 127;
   rx = -rx;
   bx=-bx;
   gx=-gx;
  col.r = rx + 127;
  col.g= gx + 127;
  col.b = bx + 127;
  col.style = "#"  + col.r.toString(16).padStart(2,"0") + col.g.toString(16).padStart(2,"0") + col.b.toString(16).padStart(2,"0")+ col.a.toString(16).padStart(2,"0");
return col;
 
}

function purebell(min,max,std_deviation=40,step=1) {
 var random_number = mt_rand(min,max);
 random_number = random_number / 10;
 random_number = Math.round(random_number);
 random_number = random_number * 10;
  return random_number;
}

function clamp(current) {
  current =  Math.max(0, Math.min(255, current));
  return current;
}

a=[") ) )",") )", "))))","","))",")))"];
